
<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="vite.svg" />
    
    <link rel="manifest" href="manifest.json" />
    <link rel="apple-touch-icon" href="vite.svg" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="GuaraFood">

    <!-- viewport-fit=cover é essencial para o rastreador não ficar embaixo da barra do iPhone -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    
    <meta name="theme-color" content="#ea580c" />
    
    <title>GuaraFood - Delivery da Cidade</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      :root {
        --sat: env(safe-area-inset-top);
        --sar: env(safe-area-inset-right);
        --sab: env(safe-area-inset-bottom);
        --sal: env(safe-area-inset-left);
      }

      @keyframes pulse-logo {
        0% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.05); opacity: 0.9; }
        100% { transform: scale(1); opacity: 1; }
      }
      
      .splash-logo {
        animation: pulse-logo 2s infinite ease-in-out;
      }

      #splash-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: #ea580c;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        color: white;
        font-family: sans-serif;
        transition: opacity 0.5s ease-out, visibility 0.5s;
        pointer-events: auto;
      }

      #splash-screen.hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      /* Ajuste de padding para iPhones com barra inferior */
      .pb-safe {
        padding-bottom: var(--sab);
      }

      @media print {
        @page {
          margin: 0mm;
          size: auto;
        }

        /* Oculta completamente a interface interativa do app para eliminar espaço de layout fantasma (100vh / A4) */
        #root,
        #splash-screen {
          display: none !important;
          height: 0 !important;
          min-height: 0 !important;
          max-height: 0 !important;
          margin: 0 !important;
          padding: 0 !important;
          overflow: hidden !important;
        }

        /* Reseta a página para bobina térmica contínua a partir do topo */
        html, body {
          margin: 0 !important;
          padding: 0 !important;
          width: 100% !important;
          height: auto !important;
          min-height: 0 !important;
          background: #ffffff !important;
          -webkit-print-color-adjust: exact !important;
          print-color-adjust: exact !important;
          overflow: visible !important;
        }

        /* Garante que os containers de impressão térmica iniciem imediatamente no topo da folha */
        #thermal-receipt-container,
        #thermal-report-closing,
        #thermal-report-motoboy,
        #thermal-unified-bill,
        #printable-order {
          display: block !important;
          visibility: visible !important;
          position: static !important;
          margin: 0 auto !important;
          padding: 0 !important;
          background: #ffffff !important;
          height: auto !important;
          min-height: 0 !important;
        }

        #thermal-receipt-container *,
        #thermal-report-closing *,
        #thermal-report-motoboy *,
        #thermal-unified-bill *,
        #printable-order * {
          visibility: visible !important;
        }

        * {
          -webkit-print-color-adjust: exact !important;
          print-color-adjust: exact !important;
        }
      }
    </style>
  <link rel="stylesheet" href="/index.css">
</head>
  <body class="bg-gray-50">
    <div id="root">
        <div id="splash-screen">
            <div class="splash-logo" style="display: flex; flex-direction: column; align-items: center;">
                <img src="/assets/aistudio/file_0000000084dc820eade5873241a40876_2910595a.png" alt="GuaraFood" style="height: 56px; object-fit: contain;" />
                <p style="margin-top: 1rem; font-size: 0.8rem; opacity: 0.8;">Carregando sua fome...</p>
            </div>
        </div>
    </div>
    <script>
      window.reactAppMounted = false;

      function hideSplash() {
        const splash = document.getElementById('splash-screen');
        if (splash) {
          splash.classList.add('hidden');
          splash.style.pointerEvents = 'none';
        }
      }

      // GARANTIA DE SAÍDA (Failsafe): some com a tela de carregamento após 3 segundos sob qualquer circunstância
      setTimeout(hideSplash, 3000);

      // ==============================================================================
      // 🛡️ SUPORTE PROFISSIONAL A AUTO-MIGRAÇÃO DE DEPLOYS SEM DERRUBAR LOJISTAS
      // ==============================================================================
      // Quando um novo deploy apaga os assets antigos, chamadas lazy import lançam um erro de preload.
      // Ouvimos esse erro globalmente para fazer um reload automático silencioso e atualizar os assets do lojista.
      window.addEventListener('vite:preloadError', (event) => {
        console.warn('[GuaraFood Deploy Handler] Nova versão detectada no servidor (Erro de Preload). Recarregando aplicação...');
        window.location.href = window.location.pathname + '?v=' + Date.now() + window.location.hash;
      });

      window.addEventListener('error', (event) => {
        const errorMsg = event.message || '';
        const isChunkError = errorMsg.indexOf('ChunkLoadError') !== -1 || 
                             errorMsg.indexOf('Loading chunk') !== -1 ||
                             errorMsg.indexOf('Failed to fetch dynamically imported module') !== -1;
        if (isChunkError) {
          console.warn('[GuaraFood Deploy Handler] Falha ao carregar fragmento de código antigo. Recarregando página...');
          event.preventDefault();
          window.location.href = window.location.pathname + '?v=' + Date.now() + window.location.hash;
        }
      }, true);

      // PWA Service Worker Registration
      if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js').then(function(reg) {
            console.log('[GuaraFood PWA] Service Worker registrado com sucesso:', reg.scope);
          }).catch(function(err) {
            console.warn('[GuaraFood PWA] Falha ao registrar Service Worker:', err);
          });
        });
      }
    </script>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
